  <title>Nómina de Conductores - Sistema de Diagramación</title>

    * {

      transition: background 0.2s;

      background-color: #5a6268;
    }

    /* Formulario de Alta */
    .form-card {
      background-color: #f8f9fa;
      border: 1px solid #e2e8f0;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .form-card h2 {
      margin-top: 0;
      font-size: 16px;
      color: #0066cc;
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .form-row input {
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    .input-legajo {
      flex: 1;
      min-width: 100px;
    }
    .input-nombre {
      flex: 2;
      min-width: 200px;
    }
    .input-lineas {
      flex: 2;
      min-width: 200px;
    }
    .btn-agregar {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-agregar:hover {
      background-color: #218838;
    }

    /* Buscador y Controles */

      margin-bottom: 15px;
    }

      width: 100%;
      padding: 12px 15px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    .search-box input:focus {
      border-color: #0066cc;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 13px;
      color: #555;
    }
    .btn-reset {
      background: none;
      border: none;
      color: #dc3545;
      cursor: pointer;
      text-decoration: underline;
      font-size: 12px;
    }

    /* Tabla */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }
    th {
      background-color: #0066cc;
      color: white;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .input-table-lineas {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
    .input-table-lineas:focus {
      border-color: #0066cc;
      background-color: #fff;
    }
    .btn-eliminar {

      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;

    }

      padding: 20px;

      display: none;
    }
    .col-acciones {
      width: 90px;
      text-align: center;
    }
    .col-legajo {
      width: 100px;

  </style>

    let conductores = [];

    // Cargar datos guardados o inicializar
    function cargarStorage() {
      const guardados = localStorage.getItem('conductores_data');
      if (guardados) {
        conductores = JSON.parse(guardados);
      } else {
        conductores = JSON.parse(JSON.stringify(conductoresBase));
      }
      ordenarLista();
    }

    function guardarStorage() {
      localStorage.setItem('conductores_data', JSON.stringify(conductores));
    }

    function ordenarLista() {
      conductores.sort((a, b) => Number(a.leg) - Number(b.leg));
    }

    function cargarTabla(datos) {
      const cuerpo = document.getElementById('cuerpoTabla');
      cuerpo.innerHTML = '';
      datos.forEach((c) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${c.leg}</strong></td>
          <td>${c.nombre}</td>
          <td>
            <input type="text" class="input-table-lineas" value="${c.lineas || ''}" 
                   placeholder="Ej: Línea 10, Línea 20" 
                   onchange="actualizarLineas(${c.leg}, this.value)">
          </td>
          <td class="col-acciones">
            <button class="btn-eliminar" onclick="eliminarConductor(${c.leg})">Eliminar</button>
          </td>
        `;
        cuerpo.appendChild(tr);
      });
    }

    function actualizarLineas(legajo, nuevasLineas) {
      const conductor = conductores.find(c => Number(c.leg) === Number(legajo));
      if (conductor) {
        conductor.lineas = nuevasLineas;
        guardarStorage();
      }
    }

    function filtrarLista() {
      const filtro = document.getElementById('searchInput').value.toLowerCase();
      const filtrados = conductores.filter(c => 
        String(c.leg).includes(filtro) || 
        c.nombre.toLowerCase().includes(filtro) ||
        (c.lineas && c.lineas.toLowerCase().includes(filtro))
      );
      
      cargarTabla(filtrados);
      
      document.getElementById('noResult').style.display = 
        filtrados.length === 0 ? 'block' : 'none';
    }

    function agregarConductor() {
      const legajoInput = document.getElementById('newLegajo');
      const nombreInput = document.getElementById('newNombre');
      const lineasInput = document.getElementById('newLineas');

      const legajoVal = Number(legajoInput.value);
      const nombreVal = nombreInput.value.trim().toUpperCase();
      const lineasVal = lineasInput.value.trim();

      if (!legajoVal || !nombreVal) {
        alert('Por favor complete tanto el número de Legajo como el Nombre y Apellido.');
        return;
      }

      const existe = conductores.some(c => Number(c.leg) === legajoVal);
      if (existe) {
        alert(`El legajo ${legajoVal} ya pertenece a otro conductor.`);
        return;
      }

      conductores.push({ leg: legajoVal, nombre: nombreVal, lineas: lineasVal });
      ordenarLista();
      guardarStorage();

      legajoInput.value = '';
      nombreInput.value = '';
      lineasInput.value = '';
      document.getElementById('searchInput').value = '';
      filtrarLista();
    }

    function eliminarConductor(legajo) {
      if (confirm(`¿Está seguro de eliminar al conductor con Legajo ${legajo}?`)) {
        conductores = conductores.filter(c => Number(c.leg) !== Number(legajo));
        guardarStorage();
        filtrarLista();
      }
    }

    function restablecerOriginales() {
      if (confirm('¿Desea restablecer la lista original? Se perderán las modificaciones personalizadas no guardadas en código.')) {
        localStorage.removeItem('conductores_data');
        cargarStorage();
        cargarTabla(conductores);
      }
    }

    // Inicializar
    cargarStorage();
    cargarTabla(conductores);
  </script>

</body>
</html>
